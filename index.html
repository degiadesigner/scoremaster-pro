    <style>
        /* BẢNG LỊCH SỬ ĐIỂM */
.history-board {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    background: var(--c-dark);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.board-header {
    display: flex;
    background: #1e2126;
    padding: 12px 0;
    border-bottom: 2px solid var(--c-orange);
    position: sticky;
    top: 0;
    z-index: 10;
}

.board-col {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-right: 1px solid rgba(255,255,255,0.05);
}
.board-col:last-child { border-right: none; }

.col-stt {
    flex: 0 0 50px; /* Cột STT nhỏ gọn */
    color: #888;
    font-size: 14px;
    font-weight: 700;
}

.col-name {
    font-size: 14px;
    font-weight: 800;
    color: #aaa;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
}

.col-total {
    font-size: 26px;
    font-weight: 900;
    color: var(--text-light);
}

.board-body {
    overflow-y: auto;
    max-height: 50vh; /* Giới hạn chiều cao để cuộn */
}

.history-row {
    display: flex;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    align-items: center;
}
.history-row:nth-child(even) {
    background: rgba(255,255,255,0.02);
}

.col-score {
    font-size: 20px;
    font-weight: 700;
}

.col-score.positive { color: var(--c-red); } /* Điểm cộng (Thua) màu đỏ */
.col-score.negative { color: var(--c-green); } /* Điểm trừ (Thắng) màu xanh */

/* UI DÒNG NHẬP ĐIỂM */
.input-score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.2);
    padding: 10px 16px;
    border-radius: 12px;
}
.input-score-row input {
    width: 80px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    padding: 8px;
    border-radius: 8px;
    border: none;
    background: #1e2126;
    color: white;
}

/* UI XẾP HẠNG */
.rank-item {
    display: flex;
    align-items: center;
    padding: 16px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    gap: 16px;
}
.rank-medal { font-size: 32px; }
.rank-name { flex: 1; font-size: 20px; font-weight: 800; }
.rank-score { font-size: 28px; font-weight: 900; color: var(--c-orange); }
        :root {
            --bg-color: #121418;
            --text-light: #FFFFFF;
            /* Hệ màu bệt - Rất nhẹ cho máy, không gây lag */
            --c-red: #D9534F;
            --c-orange: #F0AD4E;
            --c-blue: #3A87AD;
            --c-green: #5CB85C;
            --c-purple: #9B59B6;
            --c-dark: #2B2E33;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Tắt tính năng bôi đen text và chạm đúp phóng to gây lỗi trên di động */
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

   /* TOÀN BỘ CSS CHO PHẦN ĐẦU TRANG */
.header {

.header-icons {

.app-logo {

    height: 38px;
    border-radius: 10px;

}

            display: flex;

            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            outline: none;
        }

        .input-center {
            text-align: center !important;
            font-weight: 600;
            font-size: 20px !important;
        }

        .btn {
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            width: 100%;
            margin-top: auto;
            text-transform: uppercase;
        }
        .btn-primary {
            background-color: var(--c-orange);
            color: #000;
        }
        .btn-secondary {
            background-color: var(--c-dark);
            color: white;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); 
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal.active { display: flex; }

        .modal-box {
            background: var(--c-dark);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--c-orange);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .num-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .num-btn:active { background: rgba(255,255,255,0.3); }

        /* WINNER BANNER - CÀ KHỊA NGƯỜI THUA */
        .winner-text {
            font-size: 30px;
            font-weight: 900;
            color: var(--c-orange);

            text-shadow: 2px 2px 0px #000;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .loser-badge {
            color: var(--c-red); 
            font-size: 40px; 
            display: block; 
            margin-top: 5px;
            text-shadow: 2px 2px 0px #000;
        }

        /* FOOTER BẢN QUYỀN */
        .copyright-footer {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin-top: auto;
            padding-top: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;

/* 1. ĐỔI TOÀN BỘ FONT CHỮ SANG MONTSERRAT */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation; 
    /* Font mới: Đẳng cấp, nét dày, số cực đẹp */

}

/* 2. LÀM NỔI BẬT KHỐI NGƯỜI CHƠI (HIỆU ỨNG THẺ BÀI 3D) */
.player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 16px; /* Bo góc tròn trịa hơn */
    padding: 12px 16px;
    height: 76px; /* Tăng nhẹ chiều cao để chứa số to */
    box-shadow: 0 4px 15px rgba(0,0,0,0.3); /* Đổ bóng khối giúp thanh điểm nổi lên */
    border: 1px solid rgba(255,255,255,0.08); /* Viền sáng nhẹ sang trọng */
}

/* 3. TÊN NGƯỜI CHƠI: DÀY, RÕ NÉT */
.name {
    font-size: 20px; /* Chữ to rõ */
    font-weight: 800; /* Nét siêu dày */
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.4); /* Bóng chữ giúp tách bạch khỏi nền màu */
}

/* 4. SỐ ĐIỂM: KHỔNG LỒ, BẮT MẮT NHẤT MÀN HÌNH */
.score-value {
    font-size: 42px; /* Phóng to số điểm */
    font-weight: 900; /* Nét dày nhất (Black) */
    min-width: 65px;
    text-align: center;
    cursor: pointer;
    text-shadow: 2px 3px 5px rgba(0,0,0,0.4); /* Đổ bóng sâu cho số điểm nổi bần bật */
    letter-spacing: -1px; /* Kéo các số sát lại cho khỏe khoắn */
}

/* 5. NÚT CỘNG/TRỪ (+ / -) SẮC NÉT */
.btn-action {
    width: 44px;
    height: 44px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.9);
    font-size: 34px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;

}

/* 6. TỐI ƯU CÁC TIÊU ĐỀ TRONG APP */
#header-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--c-orange);

    width: 100%;
    text-align: center;
}

<div id="screen-game" class="screen">

    <div class="history-board">

<script>
    const colors = ['p-red', 'p-orange', 'p-blue', 'p-green', 'p-purple'];
    const avatars = ['👨', '👩', '👱‍♂️', '👧', '🧔'];
    
    // TẢI DỮ LIỆU TÊN NGƯỜI CHƠI
    const savedPlayers = localStorage.getItem('masterScore_players');
    let players = savedPlayers ? JSON.parse(savedPlayers) : [
        { id: 1, name: '', score: 0 },
        { id: 2, name: '', score: 0 },
        { id: 3, name: '', score: 0 },
        { id: 4, name: '', score: 0 },
        { id: 5, name: '', score: 0 }
    ];
    
    // TẢI DỮ LIỆU LỊCH SỬ CÁC VÁN ĐẤU
    let rounds = JSON.parse(localStorage.getItem('masterScore_rounds')) || [];
    let goal = 100;

    // KẾT NỐI VỚI GIAO DIỆN
    const screenSetup = document.getElementById('screen-setup');
    const screenGame = document.getElementById('screen-game');
    const setupList = document.getElementById('setup-list');
    const inputLimit = document.getElementById('input-limit');
    const btnBack = document.getElementById('btn-back');
    const btnReset = document.getElementById('btn-reset');

    // HÀM LƯU TRỮ CHUNG
    function saveData() {
        localStorage.setItem('masterScore_players', JSON.stringify(players));
        localStorage.setItem('masterScore_rounds', JSON.stringify(rounds));
    }

    // --- PHẦN 1: MÀN HÌNH CÀI ĐẶT BAN ĐẦU ---
    function renderSetup() {
        setupList.innerHTML = '';
        players.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'setup-input-row';
            div.innerHTML = `
                <div class="avatar">${avatars[i % avatars.length]}</div>
                <input type="text" value="${p.name}" placeholder="Người chơi ${i + 1}" 
                       onfocus="this.select()" 
                       onchange="updateName(${p.id}, this.value)">
                <button class="btn-action" style="font-size:20px; color:#D9534F;" onclick="removePlayer(${p.id})">✕</button>
            `;
            setupList.appendChild(div);
        });
        document.getElementById('btn-add-player').style.display = players.length >= 5 ? 'none' : 'block';
    }

    window.updateName = (id, val) => {
        const p = players.find(x => x.id === id);
        if (p) {
            p.name = val.trim().toUpperCase();
            saveData();
        }
    };

    window.removePlayer = (id) => {
        players = players.filter(x => x.id !== id);
        saveData();
        renderSetup();
    };

    document.getElementById('btn-add-player').onclick = () => {
        if(players.length < 5) {
            players.push({ id: Date.now(), name: '', score: 0 });
            saveData();
            renderSetup();
        }
    };

    document.getElementById('btn-start').onclick = () => {
        const val = parseInt(inputLimit.value);
        goal = isNaN(val) || val <= 0 ? null : val;
        
        document.getElementById('goal-display').innerText = goal ? `🎯 Chạm mốc ${goal} điểm là THUA` : 'Chế độ chơi tự do không giới hạn';
        
        screenSetup.classList.remove('active');
        screenGame.classList.add('active');
        btnBack.style.display = 'block';
        btnReset.style.display = 'block';
        
        renderGame();
    };

    btnBack.onclick = () => {
        screenSetup.classList.add('active');
        screenGame.classList.remove('active');
        btnBack.style.display = 'none';
        btnReset.style.display = 'none';
    };

    // --- PHẦN 2: LOGIC BẢNG ĐIỂM & LỊCH SỬ NHẬP ---
    function calculateTotals() {
        players.forEach(p => p.score = 0);
        rounds.forEach(round => {
            players.forEach(p => {
                if(round.scores[p.id] !== undefined) p.score += round.scores[p.id];
            });
        });
    }

    function renderGame() {
        calculateTotals();
        const boardHeader = document.getElementById('board-header');
        const boardBody = document.getElementById('board-body');
        
        // Vẽ Hàng Tiêu Đề
        let headerHTML = `<div class="board-col col-stt">VÁN</div>`;
        players.forEach((p, i) => {
            const displayName = p.name || `P${i + 1}`;
            headerHTML += `
                <div class="board-col">
                    <div class="col-name">${displayName}</div>
                    <div class="col-total">${p.score}</div>
                </div>`;
        });
        boardHeader.innerHTML = headerHTML;

        // Vẽ Lịch Sử (Ván mới nhất đẩy lên trên cùng)
        boardBody.innerHTML = '';
        const reversedRounds = [...rounds].reverse();
        
        reversedRounds.forEach((round, index) => {
            const actualRoundNum = rounds.length - index;
            let rowHTML = `<div class="board-col col-stt">${actualRoundNum}</div>`;
            
            players.forEach(p => {
                const score = round.scores[p.id] || 0;
                let colorClass = score > 0 ? 'positive' : (score < 0 ? 'negative' : '');
                let displayScore = score > 0 ? `+${score}` : score;
                rowHTML += `<div class="board-col col-score ${colorClass}">${displayScore}</div>`;
            });
            
            const div = document.createElement('div');
            div.className = 'history-row';
            div.innerHTML = rowHTML;
            boardBody.appendChild(div);
        });

        checkGameOver();
    }

    window.openRoundModal = () => {
        document.getElementById('current-round-number').innerText = rounds.length + 1;
        const inputsDiv = document.getElementById('round-inputs');
        inputsDiv.innerHTML = '';
        
        players.forEach((p, i) => {
            const displayName = p.name || `P${i + 1}`;
            inputsDiv.innerHTML += `
                <div class="input-score-row">
                    <div style="font-size: 18px; font-weight: bold;">${avatars[i % avatars.length]} ${displayName}</div>
                    <input type="number" id="input-round-p${p.id}" placeholder="0" onfocus="this.select()">
                </div>
            `;
        });
        document.getElementById('modal-round').classList.add('active');
        
        // Tự động nhấp nháy con trỏ vào ô nhập của người đầu tiên
        setTimeout(() => {
            if(players.length > 0) {
                const firstInput = document.getElementById(`input-round-p${players[0].id}`);
                if(firstInput) firstInput.focus();
            }
        }, 100);
    };

    window.saveRound = () => {
        let roundScores = {};
        players.forEach(p => {
            const val = parseInt(document.getElementById(`input-round-p${p.id}`).value) || 0;
            roundScores[p.id] = val;
        });
        
        rounds.push({ scores: roundScores });
        saveData();
        closeModal('modal-round');
        renderGame();
    };

    window.closeModal = (id) => {
        document.getElementById(id).classList.remove('active');
    };

    // --- PHẦN 3: XẾP HẠNG CHUNG CUỘC ---
    function checkGameOver() {
        if(!goal) return;
        const isGameOver = players.some(p => p.score >= goal);
        
        if(isGameOver) {
            // Sắp xếp: Ai điểm thấp nhất sẽ đứng Hạng 1
            const rankedPlayers = [...players].sort((a, b) => a.score - b.score);
            
            const medals = ['🥇 NHẤT', '🥈 NHÌ', '🥉 BA', '🎖️ TƯ', '💀 BÉT'];
            const listDiv = document.getElementById('ranking-list');
            listDiv.innerHTML = '';
            
            rankedPlayers.forEach((p, index) => {
                const displayName = p.name || `Người chơi ${index + 1}`;
                // Luôn cho người cuối cùng làm Bét
                const rankName = (index === rankedPlayers.length - 1) ? medals[4] : (medals[index] || `HẠNG ${index + 1}`);
                
                listDiv.innerHTML += `
                    <div class="rank-item">
                        <div class="rank-medal">${rankName}</div>
                        <div class="rank-name">${displayName}</div>
                        <div class="rank-score">${p.score}</div>
                    </div>
                `;
            });
            
            document.getElementById('modal-ranking').classList.add('active');
        }
    }

    btnReset.onclick = () => {
        if(confirm('Chơi lại từ đầu? Thao tác này sẽ xóa toàn bộ lịch sử ván cược hiện tại!')) {
            rounds = [];
            players.forEach(p => p.score = 0);
            saveData();
            renderGame();
        }
    };

    window.newGame = () => {
        closeModal('modal-ranking');
        rounds = [];
        players.forEach(p => p.score = 0);
        saveData();
        btnBack.click(); // Quay về màn hình nhập tên
    };

    // KÍCH HOẠT APP
    renderSetup();

</script>
</body>
</html>
