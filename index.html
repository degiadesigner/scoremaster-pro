<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tính Điểm Master by MinhTT</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121418;
            --text-light: #FFFFFF;
            --c-red: #D9534F;
            --c-orange: #F0AD4E;
            --c-green: #5CB85C;
            --c-dark: #2B2E33;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation; 
            font-family: 'Montserrat', sans-serif !important; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
        }

        input {
            user-select: auto !important;
            -webkit-user-select: auto !important;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px 0 20px 0;
            gap: 16px;
            width: 100%;
        }

        #header-title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-size: 24px;
            font-weight: 900;
            color: var(--c-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }

        .app-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            object-fit: cover;
        }

        .header-icons {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
        }

        .header-icons span {
            cursor: pointer;
            padding: 8px 16px;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            gap: 12px;
        }
        .screen.active { display: flex; }

        .section-title {
            text-align: center;
            color: #888;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .goal-text {
            text-align: center;
            color: #F0AD4E;
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: 600;
            background: rgba(240, 173, 78, 0.1);
            padding: 8px;
            border-radius: 8px;
        }

        .setup-input-row {
            display: flex;
            gap: 10px;
            background: var(--c-dark);
            padding: 10px 16px;
            border-radius: 12px;
            align-items: center;
        }
        .setup-input-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            outline: none;
        }
        .input-center {
            text-align: center !important;
            font-weight: 600;
            font-size: 20px !important;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .btn-action {
            width: 44px;
            height: 44px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .history-board {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            background: #171a1f;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .board-header {
            display: flex;
            background: #111317;
            padding: 20px 0 16px 0;
            border-bottom: 3px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
        }

        .board-col {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.03);
        }
        .board-col:last-child { border-right: none; }

        .color-0 { color: #FF5A5A !important; text-shadow: 0 2px 6px rgba(255,90,90,0.4); } 
        .color-1 { color: #FFB84D !important; text-shadow: 0 2px 6px rgba(255,184,77,0.4); } 
        .color-2 { color: #4DB8FF !important; text-shadow: 0 2px 6px rgba(77,184,255,0.4); } 
        .color-3 { color: #5CE65C !important; text-shadow: 0 2px 6px rgba(92,230,92,0.4); } 
        .color-4 { color: #D966FF !important; text-shadow: 0 2px 6px rgba(217,102,255,0.4); } 

        .board-header .board-col:nth-child(even),
        .history-row .board-col:nth-child(even) { background-color: rgba(255, 255, 255, 0.05) !important; }
        .board-header .board-col:nth-child(odd),
        .history-row .board-col:nth-child(odd) { background-color: transparent !important; }
        .board-header .col-stt, .history-row .col-stt { background-color: #111317 !important; }

        .col-stt { flex: 0 0 50px; color: #888; font-size: 14px; font-weight: 700; }
        .col-name { font-size: 14px; font-weight: 900; text-transform: uppercase; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; letter-spacing: 0.5px; }
        .col-total { font-size: 34px; font-weight: 900; letter-spacing: -1.5px; margin-top: 2px; }
        .board-body { overflow-y: auto; flex-grow: 1; max-height: 55vh; }
        .history-row { display: flex; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.04); align-items: center; }
        .editable-row { cursor: pointer; transition: 0.2s; }
        .editable-row:active { background: rgba(255,255,255,0.15); }
        .col-score { font-size: 20px; font-weight: 700; }
        .col-score.positive { color: var(--c-red); }
        .col-score.negative { color: var(--c-green); }

        .btn { padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; margin-top: auto; text-transform: uppercase; }
        .btn-primary { background-color: var(--c-orange); color: #000; }
        .btn-secondary { background-color: rgba(255,255,255,0.1); color: white; }
        .btn-danger { background-color: var(--c-red); color: white; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; padding: 16px; }
        .modal.active { display: flex; }

        .modal-box {
            background: var(--c-dark); width: 100%; max-width: 420px; border-radius: 20px;
            padding: clamp(16px, 5vw, 24px); display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.05);
        }

        .modal-title { text-align: center; font-weight: 900; color: var(--c-orange); text-transform: uppercase; text-shadow: 0px 2px 5px rgba(0,0,0,0.5); }
        .modal-title-danger { color: var(--c-red) !important; }
        .confirm-msg { text-align: center; font-size: 16px; line-height: 1.5; color: #eee; margin-bottom: 10px; }

        .input-score-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 10px 16px; border-radius: 12px; }
        .input-score-row input { width: 80px; text-align: center; font-size: 22px; font-weight: bold; padding: 8px; border-radius: 8px; border: none; background: #1e2126; color: white; outline: none; }
        .input-score-row input:focus { border: 1px solid var(--c-orange); }

        .rank-item { display: flex; align-items: center; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; gap: 16px; }
        .rank-medal { font-size: 22px; font-weight: bold; width: 80px; }
        .rank-name { flex: 1; font-size: 18px; font-weight: 800; text-transform: uppercase; }
        .rank-score { font-size: 26px; font-weight: 900; color: var(--c-orange); }
        .copyright-footer { text-align: center; font-size: 12px; color: #555; margin-top: auto; padding-top: 20px; font-weight: 500; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div id="header-title"><img src="logo.png" alt="Logo" class="app-logo"> TÍNH ĐIỂM MASTER</div>
            <div class="header-icons">
                <span id="btn-back" style="display:none;">⚙️ Cài đặt</span>
                <span id="btn-reset" style="display:none;">🔄 Chơi lại</span>
            </div>
        </div>

        <div id="screen-setup" class="screen active">
            <h3 class="section-title">DANH SÁCH ĐẤU THỦ</h3>
            <div id="setup-list" style="display:flex; flex-direction:column; gap:10px;"></div>
            <button class="btn btn-secondary" id="btn-add-player" style="margin-top:10px;">+ Thêm người chơi</button>

            <h3 class="section-title" style="margin-top:24px;">MỐC ĐIỂM THUA CUỘC</h3>
            <div class="setup-input-row">
                <input type="number" id="input-limit" class="input-center" placeholder="Ví dụ: 100, để trống = vô tận" value="100">
            </div>
            <button class="btn btn-primary" id="btn-start" style="margin-top: 30px;">BẮT ĐẦU VÁN MỚI</button>
        </div>

        <div id="screen-game" class="screen">
            <div class="goal-text" id="goal-display">🎯 Chạm mốc 100 điểm là THUA</div>
            <div class="history-board">
                <div class="board-header" id="board-header"></div>
                <div class="board-body" id="board-body"></div>
            </div>
            <button class="btn btn-primary" style="margin-top: 16px; padding: 20px; font-size: 18px;" onclick="openRoundModal()">+ NHẬP ĐIỂM VÁN MỚI</button>
        </div>

        <div class="copyright-footer">© Bản quyền MinhTT, 2026<br>SĐT: 0987334004</div>
    </div>

    <!-- CÁC MODALS -->
    <div id="modal-round" class="modal">
        <div class="modal-box">
            <div class="modal-title" style="font-size: 22px;">NHẬP ĐIỂM VÁN <span id="current-round-number"></span></div>
            <div id="round-inputs" style="display: flex; flex-direction: column; gap: 12px; margin: 16px 0;"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" onclick="closeModal('modal-round')">Hủy</button>
                <button class="btn btn-primary" onclick="saveRound()">Lưu Ván</button>
            </div>
        </div>
    </div>

    <div id="modal-edit" class="modal">
        <div class="modal-box">
            <div class="modal-title" style="font-size: 22px;">SỬA ĐIỂM VÁN <span id="edit-round-number"></span></div>
            <div id="edit-inputs" style="display: flex; flex-direction: column; gap: 12px; margin: 16px 0;"></div>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-secondary" onclick="closeModal('modal-edit')">Hủy</button>
                    <button class="btn btn-primary" onclick="saveEditRound()">Cập nhật</button>
                </div>
                <button class="btn btn-danger" onclick="confirmDeleteRound()">🗑️ XÓA VÁN NÀY</button>
            </div>
        </div>
    </div>

    <div id="modal-confirm" class="modal" style="z-index: 999;">
        <div class="modal-box" style="max-width: 350px;">
            <div class="modal-title modal-title-danger" style="font-size: 24px;">⚠️ XÁC NHẬN</div>
            <div class="confirm-msg" id="confirm-message-text">Bạn có chắc chắn muốn thực hiện?</div>
            <div style="display:flex; gap:10px; margin-top: 10px;">
                <button class="btn btn-secondary" onclick="closeConfirmModal()">Hủy Bỏ</button>
                <button class="btn btn-danger" onclick="executeConfirm()">Đồng Ý</button>
            </div>
        </div>
    </div>

    <div id="modal-ranking" class="modal">
        <div class="modal-box" style="background: var(--bg-color);">
            <!-- BỘ MÃ LÕI ÉP CHỮ NẰM TRÊN 1 DÒNG (KHÔNG BAO GIỜ BỊ RỚT "CUỘC") -->
            <div class="modal-title" style="white-space: nowrap !important; font-size: clamp(16px, 5.5vw, 22px) !important; letter-spacing: 0px !important; margin-bottom: 8px;">🏆 KẾT QUẢ CHUNG CUỘC</div>
            
            <div id="ranking-list" style="display: flex; flex-direction: column; gap: 10px; margin: 20px 0;"></div>
            <button class="btn btn-primary" onclick="newGame()">LẬP BÀN MỚI</button>
            <button class="btn btn-secondary" style="margin-top: 10px;" onclick="closeModal('modal-ranking')">Xem lại Lịch sử</button>
        </div>
    </div>

<script>
    const avatars = ['👨', '👩', '👱‍♂️', '👧', '🧔'];
    const playerColors = ['#D9534F', '#F0AD4E', '#3A87AD', '#5CB85C', '#9B59B6'];
    
    const savedPlayers = localStorage.getItem('masterScore_players');
    let players = savedPlayers ? JSON.parse(savedPlayers) : [
        { id: 1, name: '', score: 0 },
        { id: 2, name: '', score: 0 },
        { id: 3, name: '', score: 0 },
        { id: 4, name: '', score: 0 },
        { id: 5, name: '', score: 0 }
    ];
    
    let rounds = JSON.parse(localStorage.getItem('masterScore_rounds')) || [];
    let goal = 100;
    let editingIndex = -1;
    let confirmActionCallback = null;

    const screenSetup = document.getElementById('screen-setup');
    const screenGame = document.getElementById('screen-game');
    const setupList = document.getElementById('setup-list');
    const inputLimit = document.getElementById('input-limit');
    const btnBack = document.getElementById('btn-back');
    const btnReset = document.getElementById('btn-reset');

    function saveData() {
        localStorage.setItem('masterScore_players', JSON.stringify(players));
        localStorage.setItem('masterScore_rounds', JSON.stringify(rounds));
    }

    window.showConfirmModal = (message, callback) => {
        document.getElementById('confirm-message-text').innerText = message;
        confirmActionCallback = callback;
        document.getElementById('modal-confirm').classList.add('active');
    };

    window.closeConfirmModal = () => {
        document.getElementById('modal-confirm').classList.remove('active');
        confirmActionCallback = null;
    };

    window.executeConfirm = () => {
        if(confirmActionCallback) confirmActionCallback();
        closeConfirmModal();
    };

    function renderSetup() {
        setupList.innerHTML = '';
        players.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'setup-input-row';
            div.innerHTML = `
                <div class="avatar">${avatars[i % avatars.length]}</div>
                <input type="text" value="${p.name}" placeholder="Người chơi ${i + 1}" 
                       onfocus="this.select()" onchange="updateName(${p.id}, this.value)">
                <button class="btn-action" style="font-size:20px; color:#D9534F;" onclick="removePlayer(${p.id})">✕</button>
            `;
            setupList.appendChild(div);
        });
        document.getElementById('btn-add-player').style.display = players.length >= 5 ? 'none' : 'block';
    }

    window.updateName = (id, val) => {
        const p = players.find(x => x.id === id);
        if (p) { p.name = val.trim().toUpperCase(); saveData(); }
    };

    window.removePlayer = (id) => {
        players = players.filter(x => x.id !== id);
        saveData(); renderSetup();
    };

    document.getElementById('btn-add-player').onclick = () => {
        if(players.length < 5) {
            players.push({ id: Date.now(), name: '', score: 0 });
            saveData(); renderSetup();
        }
    };

    document.getElementById('btn-start').onclick = () => {
        const val = parseInt(inputLimit.value);
        goal = isNaN(val) || val <= 0 ? null : val;
        document.getElementById('goal-display').innerText = goal ? `🎯 Chạm mốc ${goal} điểm là THUA` : 'Chế độ chơi tự do không giới hạn';
        
        screenSetup.classList.remove('active');
        screenGame.classList.add('active');
        btnBack.style.display = 'block';
        btnReset.style.display = 'block';
        renderGame();
    };

    btnBack.onclick = () => {
        screenSetup.classList.add('active');
        screenGame.classList.remove('active');
        btnBack.style.display = 'none';
        btnReset.style.display = 'none';
    };

    function calculateTotals() {
        players.forEach(p => p.score = 0);
        rounds.forEach(round => {
            players.forEach(p => {
                if(round.scores[p.id] !== undefined) p.score += round.scores[p.id];
            });
        });
    }

    function renderGame() {
        calculateTotals();
        const boardHeader = document.getElementById('board-header');
        const boardBody = document.getElementById('board-body');
        
        let headerHTML = `<div class="board-col col-stt" style="justify-content:flex-end; padding-bottom:12px;">VÁN</div>`;
        players.forEach((p, i) => {
            const displayName = p.name || `P${i + 1}`;
            const colorClass = `color-${i % 5}`; 
            headerHTML += `
                <div class="board-col">
                    <div class="col-name ${colorClass}">${displayName}</div>
                    <div class="col-total ${colorClass}">${p.score}</div>
                </div>`;
        });
        boardHeader.innerHTML = headerHTML;

        let rowsHTML = '';
        const reversedRounds = [...rounds].reverse();
        
        reversedRounds.forEach((round, index) => {
            const actualRoundNum = rounds.length - index;
            const trueIndex = rounds.length - 1 - index; 
            
            let innerHTML = `<div class="board-col col-stt">${actualRoundNum}</div>`;
            
            players.forEach(p => {
                const score = round.scores[p.id] || 0;
                let scoreClass = score > 0 ? 'positive' : (score < 0 ? 'negative' : '');
                let displayScore = score > 0 ? `+${score}` : score;
                innerHTML += `<div class="board-col col-score ${scoreClass}">${displayScore}</div>`;
            });
            
            rowsHTML += `<div class="history-row editable-row" onclick="openEditModal(${trueIndex})">${innerHTML}</div>`;
        });
        
        boardBody.innerHTML = rowsHTML;
        checkGameOver();
    }

    window.openRoundModal = () => {
        document.getElementById('current-round-number').innerText = rounds.length + 1;
        const inputsDiv = document.getElementById('round-inputs');
        inputsDiv.innerHTML = '';
        
        players.forEach((p, i) => {
            const displayName = p.name || `P${i + 1}`;
            inputsDiv.innerHTML += `
                <div class="input-score-row">
                    <div style="font-size: 18px; font-weight: bold;">${avatars[i % avatars.length]} <span class="color-${i % 5}">${displayName}</span></div>
                    <input type="number" id="input-round-p${p.id}" placeholder="0" onfocus="this.select()">
                </div>
            `;
        });
        document.getElementById('modal-round').classList.add('active');
        
        setTimeout(() => {
            if(players.length > 0) {
                const firstInput = document.getElementById(`input-round-p${players[0].id}`);
                if(firstInput) firstInput.focus();
            }
        }, 100);
    };

    window.saveRound = () => {
        let roundScores = {};
        players.forEach(p => {
            const val = parseInt(document.getElementById(`input-round-p${p.id}`).value) || 0;
            roundScores[p.id] = val;
        });
        rounds.push({ scores: roundScores });
        saveData(); closeModal('modal-round'); renderGame();
    };

    window.openEditModal = (index) => {
        editingIndex = index;
        const round = rounds[index];
        document.getElementById('edit-round-number').innerText = index + 1;
        
        const inputsDiv = document.getElementById('edit-inputs');
        inputsDiv.innerHTML = '';
        
        players.forEach((p, i) => {
            const displayName = p.name || `P${i + 1}`;
            const currentScore = round.scores[p.id] || 0;
            inputsDiv.innerHTML += `
                <div class="input-score-row">
                    <div style="font-size: 18px; font-weight: bold;">${avatars[i % avatars.length]} <span class="color-${i % 5}">${displayName}</span></div>
                    <input type="number" id="edit-round-p${p.id}" value="${currentScore}" onfocus="this.select()">
                </div>
            `;
        });
        document.getElementById('modal-edit').classList.add('active');
    };

    window.saveEditRound = () => {
        if(editingIndex === -1) return;
        let roundScores = {};
        players.forEach(p => {
            const val = parseInt(document.getElementById(`edit-round-p${p.id}`).value) || 0;
            roundScores[p.id] = val;
        });
        rounds[editingIndex].scores = roundScores;
        saveData(); closeModal('modal-edit'); renderGame();
    };

    window.confirmDeleteRound = () => {
        if(editingIndex === -1) return;
        showConfirmModal('Bạn có chắc chắn muốn xóa hẳn ván này không?\nToàn bộ điểm sẽ được tự động tính lại.', () => {
            rounds.splice(editingIndex, 1);
            saveData(); closeModal('modal-edit'); renderGame();
        });
    };

    window.closeModal = (id) => { document.getElementById(id).classList.remove('active'); };

    function checkGameOver() {
        if(!goal) return;
        const isGameOver = players.some(p => p.score >= goal);
        
        if(isGameOver) {
            const rankedPlayers = [...players].sort((a, b) => a.score - b.score);
            const medals = ['🥇 NHẤT', '🥈 NHÌ', '🥉 BA', '🎖️ TƯ', '💀 BÉT'];
            const listDiv = document.getElementById('ranking-list');
            listDiv.innerHTML = '';
            
            rankedPlayers.forEach((p, index) => {
                const displayName = p.name || `Người chơi ${index + 1}`;
                const rankName = (index === rankedPlayers.length - 1) ? medals[4] : (medals[index] || `HẠNG ${index + 1}`);
                listDiv.innerHTML += `
                    <div class="rank-item">
                        <div class="rank-medal">${rankName}</div>
                        <div class="rank-name">${displayName}</div>
                        <div class="rank-score">${p.score}</div>
                    </div>`;
            });
            document.getElementById('modal-ranking').classList.add('active');
        }
    }

    btnReset.onclick = () => {
        showConfirmModal('Bạn muốn chơi lại từ đầu?\nToàn bộ lịch sử điểm của bàn này sẽ bị xóa sạch!', () => {
            rounds = []; players.forEach(p => p.score = 0);
            saveData(); renderGame();
        });
    };

    window.newGame = () => {
        closeModal('modal-ranking');
        rounds = []; players.forEach(p => p.score = 0);
        saveData(); btnBack.click();
    };

    renderSetup();
</script>
</body>
</html>
