<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScoreMaster Pro Edition by MinhTT</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ScoreMaster">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            /* Tông nền sâu thẳm, đen tuyền (Abyss Black) */
            --bg-color: #030406;
            --card-bg: rgba(20, 22, 28, 0.45);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #FFFFFF;
            --text-secondary: #8B949E;
            
            /* Màu hệ thống */
            --accent-gold: #D4AF37;
            --accent-gold-hover: #F3E5AB;
            --danger: #FF4F4F;
            
            /* HỆ MÀU CAO CẤP DẠNG GRADIENT (Jewel Tones) */
            --p1-grad: linear-gradient(135deg, #00C6FF, #0072FF);
            --p1-glow: rgba(0, 198, 255, 0.2);
            
            --p2-grad: linear-gradient(135deg, #F77062, #FE5196);
            --p2-glow: rgba(254, 81, 150, 0.2);
            
            --p3-grad: linear-gradient(135deg, #11998E, #38EF7D);
            --p3-glow: rgba(56, 239, 125, 0.2);
            
            --p4-grad: linear-gradient(135deg, #FF8008, #FFC837);
            --p4-glow: rgba(255, 128, 8, 0.2);
            
            --p5-grad: linear-gradient(135deg, #F2C94C, #F2994A);
            --p5-glow: rgba(242, 201, 76, 0.2);

            --border-radius: 28px;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-stack);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.015) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(255,255,255,0.015) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
            justify-content: space-between;
            gap: 16px;
            padding: 10px 0;
        }

        /* Header Tinh tế */
        .app-header {
            text-align: center;
            padding: 10px 0 5px 0;
        }

        .app-header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2.5px;
            background: linear-gradient(180deg, #FFFFFF 0%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .app-header h1 span {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-header .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Screens management */
        .screen {
            display: none;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
            animation: screenFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes screenFadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Glassmorphism Cards */
        .premium-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--accent-gold);
            border-radius: 4px;
        }

        /* Dòng nhập liệu tinh tế */
        .player-row-setup {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.02);
            transition: all 0.3s;
        }
        
        .player-row-setup:focus-within {
            border-color: rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
        }

        /* Chấm màu dạng quang phổ */
        .player-color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 12px currentColor;
        }

        .player-index {
            color: rgba(255,255,255,0.3);
            width: 24px;
            font-size: 14px;
            font-weight: 700;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 700;
            outline: none;
        }

        input::placeholder {
            color: rgba(255,255,255,0.15);
            font-weight: 500;
        }

        /* Buttons Cao Cấp */
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 20px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #997300 100%);
            color: #000;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25);
            margin-top: 10px;
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text-primary);
        }

        .btn-secondary:active {
            background: rgba(255,255,255,0.08);
            transform: scale(0.96);
        }

        .btn-danger-icon {
            background: transparent;
            color: rgba(255,255,255,0.2);
            border: none;
            padding: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-danger-icon:active {
            color: var(--danger);
        }

        .btn-full {
            width: 100%;
        }

        /* Info Bar */
        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            padding: 0 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* SMART GRID: Cấu hình lưới tự động tràn viền cực kỳ thông minh */
        .game-grid { 
            display: grid; 
            gap: 16px; 
            grid-template-columns: repeat(2, 1fr); 
            flex-grow: 1; 
        }
        
        /* Chìa khóa thiết kế: Nếu là thẻ cuối cùng và ở vị trí số lẻ (3, 5), nó tự động tràn 2 cột */
        .player-score-card:last-child:nth-child(odd) {
            grid-column: 1 / -1;
            padding: 30px 20px; /* Thẻ tràn viền được làm cao hơn chút để cân đối */
        }
        
        /* Font số bự hơn cho thẻ tràn viền */
        .player-score-card:last-child:nth-child(odd) .score-display {
            font-size: 96px; 
        }

        /* THẺ ĐIỂM NGƯỜI CHƠI - KÍNH MỜ CAO CẤP */
        .player-score-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Ánh sáng hắt (Glow) */
        .player-score-card::before {
            content: '';
            position: absolute;
            bottom: -30%;
            left: 0;
            width: 100%;
            height: 60%;
            border-radius: 50%;
            filter: blur(45px);
            opacity: 0.5;
            z-index: 0;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .p1-theme::before { background: var(--p1-glow); }
        .p2-theme::before { background: var(--p2-glow); }
        .p3-theme::before { background: var(--p3-glow); }
        .p4-theme::before { background: var(--p4-glow); }
        .p5-theme::before { background: var(--p5-glow); }

        /* Nổi bật người dẫn đầu (Hiệu ứng đập nhịp nhàng) */
        .player-score-card.leading {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }
        .player-score-card.leading::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--border-radius);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
            pointer-events: none;
        }

        .player-name, .score-display, .mini-actions {
            position: relative;
            z-index: 1;
        }

        .player-name {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.85);
        }

        /* CON SỐ MẠ MÀU (Gradient Text) */
        .score-display {
            font-size: 72px;
            font-weight: 900;
            margin: 10px 0;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.2s;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            padding: 5px 0;
        }

        .p1-theme .score-display { background-image: var(--p1-grad); }
        .p2-theme .score-display { background-image: var(--p2-grad); }
        .p3-theme .score-display { background-image: var(--p3-grad); }
        .p4-theme .score-display { background-image: var(--p4-grad); }
        .p5-theme .score-display { background-image: var(--p5-grad); }

        .score-display:active {
            transform: scale(1.1);
            opacity: 0.7;
        }

        /* Nút cộng/trừ */
        .mini-actions {
            display: flex;
            gap: 24px;
            width: 100%;
            justify-content: center;
            margin-top: 5px;
        }

        .btn-mini {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            color: #FFF;
            font-size: 24px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .p1-theme .btn-mini:active { background: var(--p1-grad); border-color: transparent; box-shadow: 0 0 20px var(--p1-glow); }
        .p2-theme .btn-mini:active { background: var(--p2-grad); border-color: transparent; box-shadow: 0 0 20px var(--p2-glow); }
        .p3-theme .btn-mini:active { background: var(--p3-grad); border-color: transparent; box-shadow: 0 0 20px var(--p3-glow); }
        .p4-theme .btn-mini:active { background: var(--p4-grad); border-color: transparent; box-shadow: 0 0 20px var(--p4-glow); }
        .p5-theme .btn-mini:active { background: var(--p5-grad); border-color: transparent; box-shadow: 0 0 20px var(--p5-glow); }

        .btn-mini:active {
            transform: scale(0.8);
        }

        /* Modals Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: rgba(15, 17, 22, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            animation: modalScaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        .modal-content::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.02), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
            pointer-events: none;
        }

        @keyframes shine { 100% { left: 200%; } }
        @keyframes modalScaleUp {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: rgba(255,255,255,0.6);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Bàn phím số Numpad Cao Cấp */
        .score-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn-preset {
            padding: 18px 0;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .modal-p1-theme .btn-preset:active { background: var(--p1-grad); border-color: transparent; }
        .modal-p2-theme .btn-preset:active { background: var(--p2-grad); border-color: transparent; }
        .modal-p3-theme .btn-preset:active { background: var(--p3-grad); border-color: transparent; }
        .modal-p4-theme .btn-preset:active { background: var(--p4-grad); border-color: transparent; }
        .modal-p5-theme .btn-preset:active { background: var(--p5-grad); border-color: transparent; }

        .btn-preset:active { transform: scale(0.9); }

        .modal-actions { display: flex; gap: 12px; margin-top: 10px; }
        .modal-actions .btn { flex: 1; }

        /* Khung chiến thắng (Winner) */
        .winner-box {
            text-align: center;
            padding: 35px 20px;
            border-radius: 24px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .winner-box span.title {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .winner-highlight {
            font-size: 42px;
            font-weight: 900;
            margin-top: 15px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .win-p1-theme .winner-highlight { background-image: var(--p1-grad); }
        .win-p2-theme .winner-highlight { background-image: var(--p2-grad); }
        .win-p3-theme .winner-highlight { background-image: var(--p3-grad); }
        .win-p4-theme .winner-highlight { background-image: var(--p4-grad); }
        .win-p5-theme .winner-highlight { background-image: var(--p5-grad); }

        /* Footer */
        .app-footer {
            text-align: center;
            padding: 15px 0 5px 0;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <h1 id="app-main-title">SCOREMASTER <span>PRO</span></h1>
            <div class="subtitle">Đẳng cấp bảng điểm điện tử</div>
        </header>

        <main id="screen-setup" class="screen active">
            <div class="premium-card">
                <div class="card-title">Danh sách đấu thủ</div>
                <div id="players-setup-list">
                    </div>
                <button type="button" class="btn btn-secondary btn-full" id="btn-add-player" style="margin-top: 10px; border-style: dashed; opacity: 0.7;">
                    + THÊM NGƯỜI CHƠI
                </button>
            </div>

            <div class="premium-card">
                <div class="card-title">Thông số trận đấu</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label style="font-size: 13px; color: var(--text-secondary); font-weight: 600;">Mốc điểm chiến thắng (Bỏ trống = Vô tận)</label>
                    <div class="player-row-setup" style="background: rgba(0,0,0,0.5);">
                        <input type="number" id="input-limit" placeholder="Ví dụ: 100, 500..." pattern="[0-9]*" inputmode="numeric" style="text-align: center;">
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-primary btn-full" id="btn-start-game">
                KHỞI ĐỘNG TRẬN ĐẤU
            </button>
        </main>

        <main id="screen-game" class="screen">
            <div class="info-bar">
                <span id="info-limit-display">Mốc giới hạn: --</span>
                <span id="info-round-display">Đang diễn ra</span>
            </div>

            <div id="game-board-grid" class="game-grid">
                </div>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button type="button" class="btn btn-secondary" id="btn-back-setup" style="flex: 1;">
                    CÀI ĐẶT LẠI
                </button>
                <button type="button" class="btn btn-secondary" id="btn-reset-scores" style="flex: 1;">
                    RESET ĐIỂM
                </button>
            </div>
        </main>

        <footer class="app-footer">
            <span id="footer-text">© MinhTT • Pro Edition • 2026</span>
        </footer>

    </div>

    <div id="modal-score-input" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="score-modal-title">NHẬP ĐIỂM</div>
            
            <div style="background: rgba(0,0,0,0.4); border-radius: 20px; padding: 12px; border: 1px solid rgba(255,255,255,0.02);">
                <input type="number" id="input-quick-score" placeholder="0" pattern="-?[0-9]*" inputmode="numeric" style="font-size: 46px; text-align: center; width: 100%; padding: 10px; font-weight: 900;">
            </div>

            <div class="score-presets">
                <button type="button" class="btn-preset" onclick="adjustInputScore(5)">+5</button>
                <button type="button" class="btn-preset" onclick="adjustInputScore(10)">+10</button>
                <button type="button" class="btn-preset" onclick="adjustInputScore(20)">+20</button>
                <button type="button" class="btn-preset" onclick="adjustInputScore(40)">+40</button>
                <button type="button" class="btn-preset" onclick="adjustInputScore(-5)">-5</button>
                <button type="button" class="btn-preset" onclick="adjustInputScore(-10)">-10</button>
                <button type="button" class="btn-preset" onclick="adjustInputScore(-20)">-20</button>
                <button type="button" class="btn-preset" onclick="adjustInputScore(-40)">-40</button>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="btn-close-score-modal">HỦY</button>
                <button type="button" class="btn btn-secondary" id="btn-confirm-score" style="background: rgba(255,255,255,0.1); color: #FFF;">XONG</button>
            </div>
        </div>
    </div>

    <div id="modal-game-over" class="modal">
        <div class="modal-content" style="max-width: 440px;">
            <div class="modal-title">KẾT QUẢ TRẬN ĐẤU</div>
            
            <div class="winner-box">
                <span class="title">Nhà Vô Địch</span>
                <span class="winner-highlight" id="winner-name-display">Người chơi</span>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <label style="font-size: 13px; color: var(--text-secondary); text-align: center; display:block; font-weight: 600;">Gia hạn mốc điểm mới:</label>
                <div class="player-row-setup" style="background: rgba(0,0,0,0.5);">
                    <input type="number" id="input-extend-limit" placeholder="Ví dụ: 150" pattern="[0-9]*" inputmode="numeric" style="text-align: center; width: 100%;">
                </div>
            </div>

            <div class="modal-actions" style="flex-direction: column; gap: 12px; margin-top: 15px;">
                <button type="button" class="btn btn-primary btn-full" id="btn-extend-confirm">
                    GIA HẠN & ĐẤU TIẾP
                </button>
                <button type="button" class="btn btn-secondary btn-full" id="btn-modal-new-game" style="border-style: dashed; opacity: 0.7;">
                    LẬP BÀN MỚI
                </button>
            </div>
        </div>
    </div>

    <script>
        const playerThemes = ['p1-theme', 'p2-theme', 'p3-theme', 'p4-theme', 'p5-theme'];
        const modalThemes = ['modal-p1-theme', 'modal-p2-theme', 'modal-p3-theme', 'modal-p4-theme', 'modal-p5-theme'];
        const winnerThemes = ['win-p1-theme', 'win-p2-theme', 'win-p3-theme', 'win-p4-theme', 'win-p5-theme'];
        const gradients = [
            'linear-gradient(135deg, #00C6FF, #0072FF)',
            'linear-gradient(135deg, #F77062, #FE5196)',
            'linear-gradient(135deg, #11998E, #38EF7D)',
            'linear-gradient(135deg, #FF8008, #FFC837)',
            'linear-gradient(135deg, #F2C94C, #F2994A)'
        ];

        let players = [
            { id: 1, name: 'HƯỜNG', score: 0 },
            { id: 2, name: 'HOA', score: 0 },
            { id: 3, name: 'TRANG', score: 0 },
            { id: 4, name: 'HÙNG', score: 0 }
        ];
        let scoreLimit = 100;
        let activePlayerIdForScore = null;
        let nextPlayerId = 5;

        const screenSetup = document.getElementById('screen-setup');
        const screenGame = document.getElementById('screen-game');
        const playersSetupList = document.getElementById('players-setup-list');
        const btnAddPlayer = document.getElementById('btn-add-player');
        const btnStartGame = document.getElementById('btn-start-game');
        const inputLimit = document.getElementById('input-limit');
        const gameBoardGrid = document.getElementById('game-board-grid');
        const infoLimitDisplay = document.getElementById('info-limit-display');
        
        const modalScoreInput = document.getElementById('modal-score-input');
        const scoreModalTitle = document.getElementById('score-modal-title');
        const inputQuickScore = document.getElementById('input-quick-score');
        const btnCloseScoreModal = document.getElementById('btn-close-score-modal');
        const btnConfirmScore = document.getElementById('btn-confirm-score');
        
        const modalGameOver = document.getElementById('modal-game-over');
        const winnerNameDisplay = document.getElementById('winner-name-display');
        const inputExtendLimit = document.getElementById('input-extend-limit');
        const btnExtendConfirm = document.getElementById('btn-extend-confirm');
        const btnModalNewGame = document.getElementById('btn-modal-new-game');

        // Bật Service Worker để PWA hoạt động
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.log('SW Info:', err));
            });
        }

        function renderSetupPlayers() {
            playersSetupList.innerHTML = '';
            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row-setup';
                row.innerHTML = `
                    <div class="player-color-dot" style="background: ${gradients[index]};"></div>
                    <span class="player-index">#${index + 1}</span>
                    <input type="text" class="player-name-input" data-id="${player.id}" value="${player.name}" placeholder="Tên đấu thủ...">
                    ${players.length > 2 ? `<button type="button" class="btn-danger-icon" onclick="removePlayerSetup(${player.id})">✕</button>` : '<div style="width:34px"></div>'}
                `;
                playersSetupList.appendChild(row);
            });

            if (players.length >= 5) {
                btnAddPlayer.style.display = 'none';
            } else {
                btnAddPlayer.style.display = 'inline-flex';
            }
        }

        window.removePlayerSetup = function(id) {
            players = players.filter(p => p.id !== id);
            renderSetupPlayers();
        };

        btnAddPlayer.addEventListener('click', () => {
            if (players.length < 5) {
                let defaultNames = ['HƯỜNG', 'HOA', 'TRANG', 'HÙNG', 'TOÀN'];
                let nextName = '';
                for(let dName of defaultNames) {
                    if(!players.some(p => p.name === dName)) {
                        nextName = dName;
                        break;
                    }
                }
                if(!nextName) nextName = `P${nextPlayerId}`;

                players.push({ id: nextPlayerId++, name: nextName, score: 0 });
                renderSetupPlayers();
            }
        });

        playersSetupList.addEventListener('input', (e) => {
            if (e.target.classList.contains('player-name-input')) {
                const id = parseInt(e.target.getAttribute('data-id'));
                const player = players.find(p => p.id === id);
                if (player) player.name = e.target.value.trim().toUpperCase() || `P${id}`;
            }
        });

        btnStartGame.addEventListener('click', () => {
            const limitVal = inputLimit.value.trim();
            scoreLimit = limitVal ? parseInt(limitVal) : null;
            
            infoLimitDisplay.innerText = scoreLimit ? `Mục tiêu: ${scoreLimit}` : 'Không giới hạn';
            switchScreen('game');
            renderGameBoard();
        });

        function switchScreen(name) {
            if (name === 'setup') {
                screenSetup.classList.add('active');
                screenGame.classList.remove('active');
            } else {
                screenSetup.classList.remove('active');
                screenGame.classList.add('active');
            }
        }

        function renderGameBoard() {
            gameBoardGrid.innerHTML = '';
            
            let highestScore = -Infinity;
            players.forEach(p => { if (p.score > highestScore) highestScore = p.score; });

            players.forEach((player, index) => {
                const isLeading = player.score === highestScore && players.length > 1 && players.some(p => p.score !== highestScore);
                const card = document.createElement('div');
                
                const themeClass = playerThemes[index];
                card.className = `player-score-card ${themeClass} ${isLeading ? 'leading' : ''}`;
                
                card.innerHTML = `
                    <div class="player-name">${player.name}</div>
                    <div class="score-display" onclick="openQuickInputScore(${player.id}, ${index})">${player.score}</div>
                    <div class="mini-actions">
                        <button type="button" class="btn-mini" onclick="changeScoreDirectly(${player.id}, -1)">-</button>
                        <button type="button" class="btn-mini" onclick="changeScoreDirectly(${player.id}, 1)">+</button>
                    </div>
                `;
                gameBoardGrid.appendChild(card);
            });

            checkWinCondition();
        }

        window.changeScoreDirectly = function(id, val) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.score += val;
                renderGameBoard();
            }
        };

        window.openQuickInputScore = function(id, playerIndex) {
            const player = players.find(p => p.id === id);
            if (player) {
                activePlayerIdForScore = id;
                scoreModalTitle.innerText = `${player.name}`;
                inputQuickScore.value = '';
                
                modalThemes.forEach(t => modalScoreInput.classList.remove(t));
                modalScoreInput.classList.add(modalThemes[playerIndex]);
                
                modalScoreInput.classList.add('active');
                setTimeout(() => inputQuickScore.focus(), 100);
            }
        };

        window.adjustInputScore = function(val) {
            let current = parseInt(inputQuickScore.value) || 0;
            inputQuickScore.value = current + val;
        };

        btnCloseScoreModal.addEventListener('click', () => {
            modalScoreInput.classList.remove('active');
        });

        btnConfirmScore.addEventListener('click', () => {
            const added = parseInt(inputQuickScore.value);
            if (!isNaN(added)) {
                const player = players.find(p => p.id === activePlayerIdForScore);
                if (player) {
                    player.score += added;
                    renderGameBoard();
                }
            }
            modalScoreInput.classList.remove('active');
        });

        function checkWinCondition() {
            if (!scoreLimit) return;
            
            const overLimit = players.filter(p => p.score >= scoreLimit);
            
            if (overLimit.length > 0) {
                overLimit.sort((a, b) => b.score - a.score);
                const winner = overLimit[0];
                const winnerIndex = players.findIndex(p => p.id === winner.id);

                winnerNameDisplay.innerText = `${winner.name}`;
                inputExtendLimit.value = scoreLimit + 50; 

                winnerThemes.forEach(t => modalGameOver.classList.remove(t));
                modalGameOver.classList.add(winnerThemes[winnerIndex]);

                modalGameOver.classList.add('active');
            }
        }

        btnExtendConfirm.addEventListener('click', () => {
            const newLimit = parseInt(inputExtendLimit.value.trim());
            if (!isNaN(newLimit) && newLimit > scoreLimit) {
                scoreLimit = newLimit;
                infoLimitDisplay.innerText = `Mục tiêu: ${scoreLimit}`;
                modalGameOver.classList.remove('active');
                renderGameBoard();
            } else {
                alert("Mốc gia hạn mới phải lớn hơn mốc điểm cũ!");
            }
        });

        btnModalNewGame.addEventListener('click', () => {
            modalGameOver.classList.remove('active');
            players.forEach(p => p.score = 0);
            switchScreen('setup');
        });

        document.getElementById('btn-back-setup').addEventListener('click', () => {
            if(confirm("Quay lại Cài đặt sẽ không làm mất điểm. Bạn đồng ý chứ?")) {
                switchScreen('setup');
            }
        });

        document.getElementById('btn-reset-scores').addEventListener('click', () => {
            if(confirm("Xóa trắng toàn bộ điểm số ván chơi này?")) {
                players.forEach(p => p.score = 0);
                renderGameBoard();
            }
        });

        inputLimit.value = 100;
        renderSetupPlayers();
    </script>
</body>
</html>
