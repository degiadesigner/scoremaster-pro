    function checkWinner() {
        if(!goal) return;
        const losers = players.filter(p => p.score >= goal);
        if(losers.length > 0) {
            losers.sort((a,b) => b.score - a.score);
            const loserName = losers[0].name ? losers[0].name : 'NGƯỜI CHƠI';
            document.getElementById('winner-name').innerText = loserName;
            document.getElementById('modal-winner').classList.add('active');
        }
    }

    window.newGame = () => {
        closeModal('modal-winner');
        players.forEach(p => p.score = 0);
        saveData();
        btnBack.click();
    };

    renderSetup();

</script>

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Đã đăng ký Service Worker!'))
                    .catch(err => console.log('Lỗi SW:', err));
            });
        }
    </script>
